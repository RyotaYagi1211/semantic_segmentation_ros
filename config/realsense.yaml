semantic_segmentation_server:
  camera:
    color_topic : /camera/color/image_raw
  model:
    model_name : "deeplabv3plus"
    encoder_name : "resnet50"
    encoder_weights : "imagenet"
    in_channels : 3
    classes : 2 #ここかえるかな
    model_path1: $(find semantic_segmentation_ros)/assets/model/deeplabv3plus_1335_loss=-0.0244.pt  # Path to your model 　こっち概形
    model_path2: $(find semantic_segmentation_ros)/assets/model/deeplabv3plus_1458_mIOU=0.7180.pt  # Path to your model  